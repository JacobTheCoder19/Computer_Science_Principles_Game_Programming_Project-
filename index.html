<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Homepage</title>
        <link rel="stylesheet" href="styles/style.css">
    </head>
    <body>
<h1> Welcome to the Wild Rambling Gambling West </h1>

<!--Menu Song/Button Click Noises-->
<audio id="menu-music" src="audio/3dcountry.mp3" loop></audio>
<audio id="click-sound" src="audio/buttonclick.mp3"></audio>

<div class="main-container">
    <img src="assets/johnwayne.png" alt="a rootin tootin cowboy" class="cowboy-image">

<div class="menu-buttons">
     <button onclick="playClick(); openMap()">Open Map</button>
     <button onclick="playClick(); openRules()">How to Play</button>
     <button onclick="playClick(); openSettings()">Settings</button>
     <button id="musicbutton" onclick="toggleMusic()">Play Music</button>

</div>
</div>

<script>
// play button click sound effect

function playClick(){
    const clickSound = document.getElementById("click-sound")
    clickSound.volume = 0.2 
    clickSound.currentTime = 0; 
    clickSound.play();
    }

function toggleMusic(){
    const music = document.getElementById("menu-music");
    const btn = document.getElementById("musicbutton");

    if (music.paused) {
        music.volume = 0.4; 
        music.play();
        btn.textContent = "Mute Music";
    } else {
        music.pause();
        btn.textContent = "Play Music";
    }
}

/* filler functions*/
function openMap(){
    console.log("Opening map...")
}
function openRules(){
    console.log("Opening rules...")

}
function openSettings(){
    console.log("Opening settings...")

}


</script>


</body>
</html>
